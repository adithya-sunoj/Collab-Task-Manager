<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Task Manager</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <span class="navbar-brand">Task Manager</span>
            <div class="d-flex">
                <span class="navbar-text text-white me-3">
                    Welcome, {{ current_user.username }}!
                </span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-9">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h3 class="mb-0">Your Tasks</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Title</th>
                                        <th>Description</th>
                                        <th>Due Date</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                {% for task in tasks %}
                                    <tr>
                                        <form method="POST" action="{{ url_for('update_task', task_id=task.id) }}">
                                            <td>
                                                <input type="text" class="form-control form-control-sm" name="title" value="{{ task.title }}" required>
                                            </td>
                                            <td>
                                                <input type="text" class="form-control form-control-sm" name="description" value="{{ task.description }}">
                                            </td>
                                            <td>
                                                <input type="text" class="form-control form-control-sm" name="due_date" value="{{ task.due_date }}">
                                            </td>
                                            <td>
                                                <select class="form-select form-select-sm" name="status">
                                                    <option value="pending" {% if task.status == 'pending' %}selected{% endif %}>Pending</option>
                                                    <option value="completed" {% if task.status == 'completed' %}selected{% endif %}>Completed</option>
                                                </select>
                                            </td>
                                            <td>
                                                <div class="d-flex gap-1">
                                                    <button type="submit" class="btn btn-success btn-sm">Update</button>
                                        </form>
                                        <form method="POST" action="{{ url_for('delete_task', task_id=task.id) }}">
                                                    <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                                        </form>
                                                </div>
                                            </td>
                                    </tr>
                                {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">Add New Task</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST" action="{{ url_for('add_task') }}">
                            <div class="mb-3">
                                <label for="title" class="form-label">Title:</label>
                                <input type="text" class="form-control" name="title" id="title" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description:</label>
                                <input type="text" class="form-control" name="description" id="description">
                            </div>
                            <div class="mb-3">
                                <label for="due_date" class="form-label">Due Date (e.g., 2025-05-02 14:00):</label>
                                <input type="text" class="form-control" name="due_date" id="due_date">
                            </div>
                            <button type="submit" class="btn btn-primary">Add Task</button>
                        </form>
                        {% for message in get_flashed_messages() %}
                            <div class="alert alert-warning mt-3">{{ message }}</div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS (optional, for dropdowns etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
